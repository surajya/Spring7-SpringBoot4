services:
  postgres:
    image: postgres:17
#    container_name: jobportal
    restart: on-failure
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    volumes:
      - D:/JAVA/UDemy/Spring7-SpringBoot4/job-portal-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: on-failure
    ports:
      - "6379:6379"