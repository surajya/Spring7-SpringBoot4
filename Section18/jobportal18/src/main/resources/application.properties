logging.pattern.console:${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}
#logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.sp.jobportal=${LOG_LEVEL:DEBUG}
logging.group.jobportal_error=com.sp.jobportal.company.controller, com.sp.jobportal.contact.controller
logging.level.jobportal_error=${LOG_LEVEL_ERROR:ERROR}
logging.file.name=logs/jobportal.log
# ===============================
# DATASOURCE
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5433/mydb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=myuser
spring.datasource.password=mypassword
# ===============================
# SQL INIT
# ===============================
spring.sql.init.mode=never
# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# Hibernate properties
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# docker lifecycle commands:
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.start.command=up
spring.docker.compose.stop.command=stop

#Redis Properties
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=yourpassword

spring.cache.type=redis

