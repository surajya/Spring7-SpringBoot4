# ===============================
# DATASOURCE
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:mydb}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASSWORD:mypassword}
# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=false
# ===============================
#Redis Properties
# ===============================
cache.jobs.ttl-minutes=5
cache.companies.ttl-minutes=5
# ===============================
#CORS Configuration
# ===============================
app.cors.allowed-origins=http://localhost:5173/
